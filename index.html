<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>科学计算器</title>
    <!-- 引入官方 Supabase SDK，确保底层数据库操作百分之百稳定 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* 默认主题：赛博矩阵 (Cyber Matrix) */
        :root {
            --bg-main: #0a0a0c;
            --bg-panel: #141418;
            --bg-sidebar: #0e0e11;
            --border-color: #22222a;
            --accent-color: #00ff66;
            --accent-hover: #00cc52;
            --text-main: #f0f0f5;
            --text-muted: #78788c;
            --msg-incoming: #1a1a22;
            --msg-outgoing: #004d2c;
            --msg-outgoing-text: #00ff66;
        }

        /* 主题二：离岸极简 (Offshore Minimal) */
        body.theme-minimal {
            --bg-main: #121212;
            --bg-panel: #1a1a1a;
            --bg-sidebar: #161616;
            --border-color: #2b2b2b;
            --accent-color: #2f81f7;
            --accent-hover: #1f6feb;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --msg-incoming: #21262d;
            --msg-outgoing: #1f6feb;
            --msg-outgoing-text: #ffffff;
        }

        /* 主题三：炽烈战术 (Tactical Amber) */
        body.theme-amber {
            --bg-main: #0d0a00;
            --bg-panel: #1a1500;
            --bg-sidebar: #120f00;
            --border-color: #332900;
            --accent-color: #ffb700;
            --accent-hover: #cc9200;
            --text-main: #ffe6b3;
            --text-muted: #997a00;
            --msg-incoming: #261f00;
            --msg-outgoing: #664d00;
            --msg-outgoing-text: #ffe6b3;
        }

        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; transition: background 0.3s; }
        
        .container { width: 100%; max-width: 420px; height: 100%; background: var(--bg-panel); display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.7); border: 1px solid var(--border-color); }

        /* 计算器界面 */
        #calc-screen { flex: 1; display: flex; flex-direction: column; padding: 18px; justify-content: flex-end; background: #121212; }
        .display { background: #1a1a1a; height: 110px; border-radius: 12px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .history { font-size: 15px; color: #777; margin-bottom: 4px; min-height: 18px; }
        .output { font-size: 38px; font-weight: bold; color: #fff; }
        
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-bottom: 10px; }
        button.key { background: #26262b; color: #fff; border: none; border-radius: 50%; width: 66px; height: 66px; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; -webkit-tap-highlight-color: transparent; }
        button.key:active { background: #444; }
        button.operator { background: #ff9f0a; color: #fff; }
        button.function { background: #d4d4d2; color: #000; }
        button.zero { grid-column: span 2; width: 144px; border-radius: 33px; }

        /* 秘密 IM 系统 */
        #secret-system { display: none; flex: 1; flex-direction: column; background: var(--bg-main); position: relative; }
        
        #auth-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-panel); z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 35px; gap: 18px; }
        #auth-panel h2 { text-align: center; color: var(--accent-color); font-size: 20px; letter-spacing: 1px; margin-bottom: 5px; }
        .tab-group { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .tab-btn { font-size: 15px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 6px; transition: color 0.2s; }
        .tab-btn.active { color: var(--accent-color); border-color: var(--accent-color); font-weight: bold; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 10px; padding: 13px; color: var(--text-main); font-size: 15px; outline: none; }
        .input-group input:focus { border-color: var(--accent-color); }
