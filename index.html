<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>科学计算器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        /* 核心修改：用 100dvh 代替 100vh，完美解决手机浏览器工具栏遮挡问题 */
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; }
        
        .container { width: 100%; max-width: 420px; height: 100%; background: #1e1e1e; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

        /* 计算器界面调整，防止溢出 */
        #calc-screen { flex: 1; display: flex; flex-direction: column; padding: 15px; justify-content: flex-end; }
        .display { background: #2b2b2b; height: 100px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 12px; margin-bottom: 15px; }
        .history { font-size: 14px; color: #888; margin-bottom: 4px; min-height: 18px; }
        .output { font-size: 36px; font-weight: bold; }
        
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 15px; }
        button.key { background: #333; color: #fff; border: none; border-radius: 50%; width: 62px; height: 62px; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; -webkit-tap-highlight-color: transparent; }
        button.key:active { background: #555; }
        button.operator { background: #ff9f0a; color: #fff; }
        button.function { background: #a5a5a5; color: #000; }
        button.zero { grid-column: span 2; width: 135px; border-radius: 30px; }

        /* 秘密 IM 系统 */
        #secret-system { display: none; flex: 1; flex-direction: column; background: #0f0f0f; position: relative; }
        
        #auth-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #181818; z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 30px; gap: 15px; }
        #auth-panel h2 { text-align: center; color: #00ff66; margin-bottom: 5px; }
        .tab-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; }
        .tab-btn { font-size: 16px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 4px; }
        .tab-btn.active { color: #00ff66; border-color: #00ff66; font-weight: bold; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; color: #888; }
        .input-group input { background: #262626; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #fff; font-size: 15px; outline: none; }
        .btn-primary { background: #00a884; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .im-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 130px; background: #161616; border-right: 1px solid #282828; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px; font-size: 12px; border-bottom: 1px solid #282828; display: flex; flex-direction: column; gap: 6px; color: #aaa; }
        .friend-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .friend-item.active { background: #262626; color: #00ff66; font-weight: bold; }
        .add-friend-btn { padding: 10px; background: #222; border: none; color: #0a84ff; font-size: 12px; cursor: pointer; text-align: center; border-top: 1px solid #282828; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0f0f0f; }
        .chat-header { background: #1f1f1f; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .chat-header h3 { font-size: 14px; color: #fff; }
        .btn-sm { background: #333; color: #fff; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .btn-danger { background: #ff3b30; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-all; }
        .message.incoming { background: #262626; align-self: flex-start; color: #ddd; }
        .message.outgoing { background: #005c4b; align-self: flex-end; color: #fff; }
        
        .chat-input-area { padding: 10px; background: #1f1f1f; display: flex; gap: 8px; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: #2b2b2b; border: none; border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 14px; outline: none; }
        .chat-input-area button { background: #00a884; color: #fff; border: none; border-radius: 18px; padding: 0 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 计算器伪装界面 -->
    <div id="calc-screen">
        <div class="display">
            <div class="history" id="history"></div>
            <div class="output" id="output">0</div>
        </div>
        <div class="keypad">
            <button class="key function" onclick="clearCalc()">AC</button>
            <button class="key function" onclick="toggleSign()">+/-</button>
            <button class="key function" onclick="appendOperator('%')">%</button>
            <button class="key operator" onclick="appendOperator('/')">÷</button>
            <button class="key" onclick="appendNumber('7')">7</button>
            <button class="key" onclick="appendNumber('8')">8</button>
            <button class="key" onclick="appendNumber('9')">9</button>
            <button class="key operator" onclick="appendOperator('*')">×</button>
            <button class="key" onclick="appendNumber('4')">4</button>
            <button class="key" onclick="appendNumber('5')">5</button>
            <button class="key" onclick="appendNumber('6')">6</button>
            <button class="key operator" onclick="appendOperator('-')">-</button>
            <button class="key" onclick="appendNumber('1')">1</button>
            <button class="key" onclick="appendNumber('2')">2</button>
            <button class="key" onclick="appendNumber('3')">3</button>
            <button class="key operator" onclick="appendOperator('+')">+</button>
            <button class="key zero" onclick="appendNumber('0')">0</button>
            <button class="key" onclick="appendNumber('.')">.</button>
            <button class="key operator" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- 2. 秘密 IM 系统 -->
    <div id="secret-system">
        <!-- 登录/注册面板 -->
        <div id="auth-panel">
            <h2>🔒 影子信道接入</h2>
            <div class="tab-group">
                <span class="tab-btn active" id="tabLogin" onclick="switchAuthMode('login')">登录</span>
                <span class="tab-btn" id="tabRegister" onclick="switchAuthMode('register')">注册新账号</span>
            </div>

            <div class="input-group">
                <label>专属隐密代号 (UID)</label>
                <input type="text" id="usernameInput" placeholder="输入你的代号">
            </div>
            <div class="input-group">
                <label>访问安全密码</label>
                <input type="password" id="passwordInput" placeholder="输入密码">
            </div>

            <button class="btn-primary" id="authSubmitBtn" onclick="handleAuthSubmit()">登录系统</button>
        </div>

        <!-- 聊天主结构 -->
        <div class="im-container">
            <!-- 好友侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span id="currentUserLabel">未接入</span>
                    <button class="btn-sm btn-danger" onclick="lockApp()">锁定并伪装</button>
                </div>
                <div class="friend-list" id="friendList"></div>
                <button class="add-friend-btn" onclick="addFriendPrompt()">+ 添加好友</button>
            </div>

            <!-- 聊天正文 -->
            <div class="chat-main">
                <div class="chat-header">
                    <h3 id="currentChatTarget">未选择好友</h3>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message incoming" style="background:transparent; color:#666; text-align:center;">选择左侧好友进行通信</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="msgInput" placeholder="输入加密消息..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://xseuvesmmsgixhrjxayc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZXV2ZXNtbXNnaXhocmp4YXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjIwMzYsImV4cCI6MjEwNzk5ODAzNn0.u3g7CTte10sKFGOM7HXaoyz1jZGhczoiXPywHPsFBLE";

    async function sbRest(table, method, queryParams = "", data = null) {
        let url = `${SUPABASE_URL}/rest/v1/${table}${queryParams}`;
        let headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };
        let options = { method: method, headers: headers };
        if (data) options.body = JSON.stringify(data);
        
        try {
            let res = await fetch(url, options);
            if (!res.ok) return null;
            let text = await res.text();
            return text ? JSON.parse(text) : [];
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    let currentInput = "0";
    let historyInput = "";
    let inputSequence = "";

    function updateDisplay() {
        document.getElementById('output').innerText = currentInput;
        document.getElementById('history').innerText = historyInput;
    }
    function appendNumber(num) {
        inputSequence += num;
        currentInput = (currentInput === "0") ? num : currentInput + num;
        updateDisplay();
    }
    function appendOperator(op) {
        inputSequence += op;
        historyInput += currentInput + " " + op + " ";
        currentInput = "0";
        updateDisplay();
    }
    function clearCalc() { currentInput = "0"; historyInput = ""; inputSequence = ""; updateDisplay(); }
    
    function calculate() {
        inputSequence += "=";
        if (inputSequence.includes("1234=")) {
            document.getElementById('calc-screen').style.display = 'none';
            document.getElementById('secret-system').style.display = 'flex';
            inputSequence = "";
            return;
        }
        try {
            currentInput = String(eval((historyInput + currentInput).replace(/×/g, '*').replace(/÷/g, '/')));
            historyInput = ""; inputSequence = "";
        } catch (e) { currentInput = "错误"; }
        updateDisplay();
    }

    function lockApp() {
        document.getElementById('secret-system').style.display = 'none';
        document.getElementById('calc-screen').style.display = 'flex';
        clearCalc();
    }

    let currentAuthMode = 'login';
    function switchAuthMode(mode) {
        currentAuthMode = mode;
        if (mode === 'login') {
            document.getElementById('tabLogin').className = 'tab-btn active';
            document.getElementById('tabRegister').className = 'tab-btn';
            document.getElementById('authSubmitBtn').innerText = '登录系统';
        } else {
            document.getElementById('tabRegister').className = 'tab-btn active';
            document.getElementById('tabLogin').className = 'tab-btn';
            document.getElementById('authSubmitBtn').innerText = '立即注册账号';
        }
    }

    let myUsername = "";
    let activeFriend = "";
    let friendsList = [];
    let pollInterval = null;

    async function handleAuthSubmit() {
        const u = document.getElementById('usernameInput').value.trim();
        const p = document.getElementById('passwordInput').value.trim();
        if (!u || !p) { alert("代号和密码不能为空！"); return; }

        if (currentAuthMode === 'register') {
            let existing = await sbRest('users', 'GET', `?username=eq.${u}`);
            if (existing && existing.length > 0) {
                alert("该代号已被注册，请换一个！");
                return;
            }
            let res = await sbRest('users', 'POST', "", { username: u, password: p });
            if (!res) { alert("注册失败！"); return; }
            alert("注册成功！已自动为您登录。");
        } else {
            let users = await sbRest('users', 'GET', `?username=eq.${u}&password=eq.${p}`);
            if (!users || users.length === 0) {
                alert("代号或密码错误！如果是新用户，请先点击【注册新账号】。");
                return;
            }
        }

        myUsername = u;
        document.getElementById('currentUserLabel').innerText = "我: " + u;
        document.getElementById('auth-panel').style.display = 'none';
        startPollingMessages();
    }

    function addFriendPrompt() {
        const friendId = prompt("请输入好友的隐密代号 (例如: user_b):");
        if (friendId && friendId !== myUsername && !friendsList.includes(friendId)) {
            friendsList.push(friendId);
            renderFriendList();
            selectFriend(friendId);
        }
    }

    function renderFriendList() {
        const listEl = document.getElementById('friendList');
        listEl.innerHTML = "";
        friendsList.forEach(f => {
            const div = document.createElement('div');
            div.className = `friend-item ${activeFriend === f ? 'active' : ''}`;
            div.innerText = "👤 " + f;
            div.onclick = () => selectFriend(f);
            listEl.appendChild(div);
        });
    }

    async function selectFriend(f) {
        activeFriend = f;
        document.getElementById('currentChatTarget').innerText = "与 [" + f + "] 通信中";
        renderFriendList();
        await loadHistoryMessages();
    }

    async function loadHistoryMessages() {
        if (!activeFriend) return;
        let data1 = await sbRest('messages', 'GET', `?sender=eq.${myUsername}&receiver=eq.${activeFriend}&order=created_at.asc`);
        let data2 = await sbRest('messages', 'GET', `?sender=eq.${activeFriend}&receiver=eq.${myUsername}&order=created_at.asc`);
        
        let allMsgs = [...(data1||[]), ...(data2||[])].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

        const container = document.getElementById('chatMessages');
        container.innerHTML = "";

        if (allMsgs.length > 0) {
            allMsgs.forEach(msg => {
                const type = (msg.sender === myUsername) ? 'outgoing' : 'incoming';
                appendMessageToUI(msg.content, type, false);
            });
            container.scrollTop = container.scrollHeight;
        } else {
            container.innerHTML = '<div class="message incoming" style="background:transparent; color:#666; text-align:center;">暂无云端加密消息</div>';
        }
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;
        if (!activeFriend) { alert("请先在左侧选择或添加好友！"); return; }

        input.value = "";
        appendMessageToUI(text, 'outgoing', true);

        await sbRest('messages', 'POST', "", {
            sender: myUsername,
            receiver: activeFriend,
            content: text
        });
    }

    function startPollingMessages() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(async () => {
            if (!myUsername) return;
            let incoming = await sbRest('messages', 'GET', `?receiver=eq.${myUsername}&order=created_at.desc&limit=5`);
            if (incoming && incoming.length > 0) {
                incoming.forEach(msg => {
                    if (!friendsList.includes(msg.sender)) {
                        friendsList.push(msg.sender);
                        renderFriendList();
                    }
                });
                if (activeFriend) {
                    await loadHistoryMessages();
                }
            }
        }, 3000);
    }

    function appendMessageToUI(text, type, scroll = true) {
        const container = document.getElementById('chatMessages');
        if (container.innerText.includes("暂无")) container.innerHTML = "";

        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerText = text;
        container.appendChild(div);
        if (scroll) container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
